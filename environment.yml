name: thalamus-embed
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pandas
  - numpy
  - scipy                # Mann-Kendall (scipy.stats.kendalltau), Wilson CI
  - requests
  - lxml
  - matplotlib
  - scikit-learn
  - jupyter
  - pyyaml
  - tqdm
  - pip:
      - sentence-transformers  # all-MiniLM-L6-v2 embeddings
      - umap-learn             # UMAP dimensionality reduction
      - hdbscan                # HDBSCAN clustering